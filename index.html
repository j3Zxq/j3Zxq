<html lang="pl">

      const emailEl = document.getElementById('user-email');
      if (emailEl) emailEl.textContent = session.user.email;
    }

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS</title>
<link rel="icon" type="image/png" sizes="32x32" href="akatsuki_logo.png">
<link rel="shortcut icon" type="image/png" href="akatsuki_logo.png">
<link rel="apple-touch-icon" href="akatsuki_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:   #0a0a0a;
  --black2:  #111111;
  --black3:  #1a1a1a;
  --red:     #8b0000;
  --red2:    #b30000;
  --red3:    #cc1a1a;
  --coal:    #2a2a2a;
  --coal2:   #383838;
  --text:    #e8e8e8;
  --muted:   rgba(232,232,232,0.38);
  --border:  rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.12);
}

html, body {
  min-height: 100%;
  background: var(--black);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* ── NOISE TEXTURE ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9999;
  opacity: 0.5;
}

/* ── SCANLINES ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9998;
}

/* ── WATERMARK (logo w tle) ── */
.bg-watermark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 45vw;
  max-width: 600px;
  min-width: 260px;
  height: auto;
  opacity: 0.08;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}

/* ── LAYOUT ── */
.hub {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 40px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 40px; right: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red2), transparent);
  opacity: 0.5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-logo {
  width: 36px;
  height: 36px;
  min-width: 36px;
  object-fit: contain;
  filter: drop-shadow(0 0 10px rgba(180,0,0,0.5));
  display: block;
}
.brand-text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.brand-name {
  font-family: 'Orbitron', monospace;
  font-size: 1.6em;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--text);
  text-shadow: 0 0 20px rgba(180,0,0,0.4);
  line-height: 1;
}
.brand-name span {
  color: var(--red2);
}
.brand-sub {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.7em;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
}

.header-right {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.75em;
  letter-spacing: 2px;
  color: var(--muted);
  text-align: right;
}
#clock {
  font-size: 1.1em;
  color: var(--text);
  display: block;
  font-weight: 600;
}

.user-panel {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 6px;
  justify-content: flex-end;
}
#user-email {
  font-size: 0.85em;
  color: var(--muted);
  letter-spacing: 1px;
}
#logout-btn {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.8em;
  letter-spacing: 1px;
  color: var(--text);
  background: transparent;
  border: 1px solid var(--muted);
  border-radius: 4px;
  padding: 3px 10px;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
#logout-btn:hover {
  border-color: var(--text);
  color: #fff;
}

/* ── GRID AREA ── */
.grid-area {
  flex: 1;
  position: relative;
  padding: 36px 40px 44px;
}

/* background glow */
.grid-area::before {
  content: '';
  position: absolute;
  width: 700px;
  height: 700px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139,0,0,0.06) 0%, transparent 70%);
  pointer-events: none;
  top: 0;
  left: 50%;
  transform: translate(-50%,-30%);
  z-index: -1;
}

/* ── CARDS GRID ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 22px;
  max-width: 1400px;
  margin: 0 auto;
}

/* ── CARD ── */
.card {
  width: 100%;
  min-height: 320px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: block;
  opacity: 0;
  transform: translateY(14px);
  animation: cardIn 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: none; }
}

.card .card-inner {
  border-color: rgba(139,0,0,0.5);
  box-shadow:
    0 0 0 1px rgba(139,0,0,0.2),
    0 20px 60px rgba(0,0,0,0.8),
    0 0 40px rgba(139,0,0,0.12),
    inset 0 1px 0 rgba(255,255,255,0.04);
}
.card:hover .card-inner {
  border-color: var(--red2);
  transform: translateY(-4px);
  box-shadow:
    0 0 0 1px rgba(179,0,0,0.4),
    0 24px 70px rgba(0,0,0,0.9),
    0 0 60px rgba(139,0,0,0.2),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
.card .card-corner { border-color: rgba(139,0,0,0.4); }
.card .card-tags .tag { border-color: rgba(139,0,0,0.35); color: rgba(232,232,232,0.55); }
.card .card-footer { border-top-color: rgba(139,0,0,0.2); }
.card:hover .card-arrow-icon { opacity: 1; transform: none; }

.card-inner {
  width: 100%;
  height: 100%;
  background: var(--black2);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* top accent bar */
.card-accent {
  height: 3px;
  width: 100%;
  flex-shrink: 0;
}

/* card background pattern */
.card-bg {
  position: absolute;
  inset: 0;
  opacity: 0.03;
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,0.5) 0px,
      rgba(255,255,255,0.5) 1px,
      transparent 1px,
      transparent 20px
    );
  pointer-events: none;
}

/* corner decoration */
.card-corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: rgba(255,255,255,0.08);
  border-style: solid;
  pointer-events: none;
}
.card-corner.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.card-corner.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.card.active .card-corner { border-color: rgba(139,0,0,0.4); }

.card-body {
  flex: 1;
  padding: 32px 28px 24px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

.card-icon {
  font-size: 2.4em;
  margin-bottom: 20px;
  display: block;
  filter: drop-shadow(0 0 12px rgba(139,0,0,0.3));
}

.card-icon-img {
  width: 1em;
  height: 1em;
  font-size: 2.4em;
  object-fit: contain;
  margin-bottom: 20px;
  display: block;
  filter: drop-shadow(0 0 12px rgba(139,0,0,0.3));
}

.card-label {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.65em;
  letter-spacing: 4px;
  color: var(--red3);
  text-transform: uppercase;
  margin-bottom: 8px;
  font-weight: 600;
}

.card-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.3em;
  font-weight: 700;
  letter-spacing: 3px;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 16px;
  text-shadow: 0 0 20px rgba(200,200,200,0.1);
}

.card-desc {
  font-size: 0.82em;
  line-height: 1.65;
  color: var(--muted);
  flex: 1;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 18px;
}

.tag {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.65em;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid var(--border2);
  color: var(--muted);
  font-weight: 500;
}
.card-footer {
  padding: 14px 28px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
}

.card-filename {
  font-family: 'Rajdhani', sans-serif;
  font-size: 0.68em;
  letter-spacing: 1.5px;
  color: var(--muted);
  font-weight: 500;
}
.card-arrow-icon {
  font-size: 0.9em;
  color: var(--red3);
  opacity: 0;
  transform: translateX(-6px);
  transition: all 0.2s;
}
.card.active:hover .card-arrow-icon {
  opacity: 1;
  transform: none;
}

@media (max-width: 900px) {
  .header { padding: 16px 20px 14px; }
  .brand-logo { width: 30px; height: 30px; min-width: 30px; }
  .brand-name { font-size: 1.2em; letter-spacing: 5px; }
  .grid-area { padding: 24px 20px 32px; }
  .cards-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
}

@media (max-width: 600px) {
  .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 16px 12px; }
  .header-right { text-align: left; width: 100%; }
  .user-panel { justify-content: flex-start; }
  .grid-area { padding: 18px 14px 28px; }
  .cards-grid { grid-template-columns: 1fr; gap: 14px; }
  .card { min-height: 260px; }
  .card-body { padding: 24px 20px 18px; }
}
</style>
</head>
<body>
<img class="bg-watermark" src="akatsuki_logo.png" alt="" aria-hidden="true">
<div class="hub">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <img class="brand-logo" src="akatsuki_logo.png" alt="Akatsuki Logo">
      <div class="brand-text">
        <div class="brand-name">N<span>E</span>XUS</div>
        <div class="brand-sub">Personal Dashboard</div>
      </div>
    </div>
    <div class="header-right">
      <span id="clock">00:00:00</span>
      <span id="date-str"></span>
      <div class="user-panel">
        <span id="user-email"></span>
        <button id="logout-btn" onclick="logout()">Wyloguj</button>
      </div>
    </div>
  </header>

  <!-- GRID -->
  <div class="grid-area">
    <div class="cards-grid" id="cards-grid"></div>
  </div>

</div>

<script>
const CARDS = [
  {
    href: 'game_log.html',
    icon: '🎮',
    label: 'Gaming',
    title: 'GAME LOG',
    desc: 'Dziennik ukończonych gier z czasem, platformą, datą i statusem Steam. Backlog, premiery i tracker platyn.',
    tags: ['Gry', 'Backlog', 'Platyny'],
    accent: 'linear-gradient(90deg, #00c853, #0ac8b9)',
  },
  {
    href: 'music_vault.html',
    icon: '🎵',
    label: 'Muzyka',
    title: 'MUSIC VAULT',
    desc: 'Kolekcja przesłuchanych płyt z ocenami. Artyści, gatunki, albumy — wszystko w jednym miejscu.',
    tags: ['Muzyka', 'Oceny', 'Albumy'],
    accent: 'linear-gradient(90deg, #9b30ff, #e84393)',
  },
  {
    href: 'screen_diary.html',
    icon: '🎬',
    label: 'Filmy & Seriale',
    title: 'SCREEN DIARY',
    desc: 'Dziennik obejrzanych filmów i seriali z plakatami z TMDB, statystykami, flip kartami i listą do obejrzenia.',
    tags: ['Filmy', 'Seriale', 'TMDB'],
    accent: 'linear-gradient(90deg, #d4a853, #e05555)',
  },
  {
    href: 'universe_watchlist.html',
    icon: '🍿',
    label: 'Watchlista uniwersów',
    title: 'UNIVERSE WATCHLIST',
    desc: 'Dziennik obejrzanych różnych serii filmowych',
    tags: ['MCU', 'DC', 'ETC'],
    accent: 'linear-gradient(90deg, #d4a853, #e05555)',
  },  
  {
    href: 'book_shelf.html',
    icon: '📚',
    label: 'Książki',
    title: 'BOOKSHELF',
    desc: 'Dziennik przeczytanych książek.',
    tags: ['Książki', 'Autorzy', 'Grafiki'],
    accent: 'linear-gradient(90deg, #d4a853, #e05555)',
  },
    {
    href: 'marksman_gauntlet.html',
    icon: 'botlane.png',
    label: 'League of Legends',
    title: 'MARKSMAN\nGAUNTLET',
    desc: 'Challenge dla marksmana — losuj lub wybieraj ADC, śledź W/L, rangi i życia każdej postaci. MVP system.',
    tags: ['LoL', 'ADC', 'MVP'],
    accent: 'linear-gradient(90deg, #f39c12, #e05555)',
  },
    {
    href: 'projectrpg.html',
    icon: '🚗',
    label: 'Multi Theft Auto',
    title: 'ProjectRPG (w trakcie)',
    desc: 'Baza Twoich pojazdów, postępy w pracach, narzędzia dla administracji i więcej.',
    tags: ['MTA', 'PRPG', 'GTA'],
    accent: 'linear-gradient(90deg, #f39c12, #e05555)',
  }
];

// ─────────────────────────────────────────────
// DŹWIĘK NAWIGACJI
// Domyślnie odtwarzany jest krótki syntetyzowany "blip" przez Web Audio API,
// więc dźwięk działa "z pudełka" bez potrzeby dołączania żadnego pliku.
//
// Aby podmienić dźwięk na własny plik: wpisz jego ścieżkę poniżej w NAV_SOUND_SRC,
// np. NAV_SOUND_SRC = 'grafiki/click.mp3';  — wtedy zamiast syntezatora
// odtwarzany będzie Twój plik audio.
// ─────────────────────────────────────────────
const NAV_SOUND_SRC = ''; // <- tu wklej ścieżkę do własnego dźwięku, jeśli chcesz go podmienić

let audioCtx = null;
let navAudioEl = null;
if (NAV_SOUND_SRC) {
  navAudioEl = new Audio(NAV_SOUND_SRC);
  navAudioEl.preload = 'auto';
}

function playSynthBlip(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(760, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(360, audioCtx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.13);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.13);
  } catch(e) { /* Web Audio niedostępne - po prostu bez dźwięku */ }
}

function playNavSound(){
  if (NAV_SOUND_SRC && navAudioEl) {
    navAudioEl.currentTime = 0;
    navAudioEl.play().catch(() => playSynthBlip());
  } else {
    playSynthBlip();
  }
}

// ── BUILD CARDS ──
function buildCards(){
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';

  CARDS.forEach((c, i) => {
    const el = document.createElement('a');
    el.className = 'card';
    el.href = c.href;
    el.target = '_blank';
    el.rel = 'noopener';
    el.style.animationDelay = (i * 0.06) + 's';
    el.dataset.index = i;

    el.addEventListener('click', () => playNavSound());

    el.innerHTML = `
      <div class="card-inner">
        <div class="card-accent" style="background:${c.accent}"></div>
        <div class="card-bg"></div>
        <div class="card-corner tl"></div>
        <div class="card-corner br"></div>
        <div class="card-body">
          ${/\.(png|jpg|jpeg|svg|webp)$/i.test(c.icon) ? `<img class="card-icon-img" src="${c.icon}" alt="">` : `<span class="card-icon">${c.icon}</span>`}
          <div class="card-label">${c.label}</div>
          <div class="card-title">${c.title.replace('\n','<br>')}</div>
          <div class="card-desc">${c.desc}</div>
          <div class="card-tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
        <div class="card-footer">
          <span class="card-filename">${c.href}</span>
          <span class="card-arrow-icon">→</span>
        </div>
      </div>`;
    grid.appendChild(el);
  });
}

// ── CLOCK ──
function updateClock(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('pl-PL', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('date-str').textContent =
    now.toLocaleDateString('pl-PL', {weekday:'short',day:'numeric',month:'long'});
}
updateClock();
setInterval(updateClock, 1000);

// ── INIT ──
buildCards();
</script>
